configuration:
  username:
    name: Username
    description: Dispatcharr admin username passed into the container.
  password:
    name: Password
    description: Dispatcharr admin password. Set this in the add-on UI; it is masked and is not stored in the add-on repository.
  epg_url:
    name: EPG URL
    description: XMLTV EPG source URL.
  timezone:
    name: Timezone
    description: IANA timezone used by the container (for example UTC or America/New_York).
  nas_symlinks:
    name: NAS symlinks
    description: Redirect recordings, EPG files, and logos from /data to a Home Assistant media mount.
  nas_path:
    name: NAS path
    description: Container path of the media mount created under Settings → System → Storage, for example /media/nas_data.
network:
  9191/TCP: Dispatcharr web interface
