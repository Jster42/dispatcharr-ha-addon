name: Dispatcharr
version: "1.1.1"
slug: dispatcharr
description: Open-source IPTV and stream management companion with EPG data, channel mapping, and hardware-accelerated transcoding support
url: https://github.com/Jster42/dispatcharr-ha-addon
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
webui: "http://[HOST]:[PORT:9191]"
timeout: 180
backup: cold
video: true
map:
  - type: media
    read_only: false
options:
  username: jeff
  password: ""
  epg_url: https://epg.iptv.cat/epg.xml
  timezone: UTC
  nas_symlinks: false
schema:
  username: str
  password: "password?"
  epg_url: url
  timezone: str
  nas_symlinks: bool
  nas_path: "str?"
ports:
  9191/tcp: 9191
ports_description:
  9191/tcp: Dispatcharr web interface
devices:
  - /dev/dri
